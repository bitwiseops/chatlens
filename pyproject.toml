[project]
name = "chatlens"
version = "0.1.0"
description = "Analisi locale e privata di chat WhatsApp a due (statistiche, temi, sentiment) via Ollama"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Flavio Cordari" }
]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "typer>=0.12",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.scripts]
chatlens = "chatlens.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
